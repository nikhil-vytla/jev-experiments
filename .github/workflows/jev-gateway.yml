name: Jev native gateway

on:
  pull_request:
    paths:
      - "experience-prototypes/server/**"
      - "packages/decision-runtime/**"
      - "roadmap/runtime/accounting.ts"
      - "gateway-accounting-2026-09-22/**"
      - ".github/workflows/jev-gateway.yml"
  push:
    branches: [main]
    paths:
      - "experience-prototypes/server/**"
      - "packages/decision-runtime/**"
      - "roadmap/runtime/accounting.ts"
      - "gateway-accounting-2026-09-22/**"
      - ".github/workflows/jev-gateway.yml"

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install application
        working-directory: experience-prototypes
        run: bun install --frozen-lockfile
      - name: Build application
        working-directory: experience-prototypes
        run: bun run build
      - name: Install decoder test dependencies
        working-directory: adapters/typescript
        run: bun install --frozen-lockfile
      - name: Verify native transport and accounting without provider calls
        run: >-
          bun test
          gateway-accounting-2026-09-22/gateway.test.ts
          gateway-accounting-2026-09-22/score.test.ts
          gateway-accounting-2026-09-22/accounting.test.ts
          gateway-accounting-2026-09-22/observer-usage.test.ts
          experience-prototypes/server/byok.test.ts
          experience-prototypes/server/gateway.test.ts
          roadmap/runtime/existing-contract.test.ts
